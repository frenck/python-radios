[project]
name = "radios"
version = "0.0.0"
description = "Asynchronous Python client for the Radio Browser API."
authors = [{ name = "Franck Nijhof", email = "opensource@frenck.dev" }]
maintainers = [{ name = "Franck Nijhof", email = "opensource@frenck.dev" }]
license = "MIT"
requires-python = ">=3.12"
readme = "README.md"
keywords = [
  "api",
  "async",
  "client",
  "home-assistant",
  "internet radio",
  "radio",
  "radio browser",
  "radios",
  "streaming",
  "web radio",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["dependencies"]
packages = [{ include = "radios", from = "src" }]
dependencies = [
  'aiodns (>=4.0)',
  'aiohttp (>=3.0.0)',
  'awesomeversion (>=21.10.1)',
  'mashumaro (>=3.10)',
  'orjson (>=3.9.8)',
  'probatio (>=0.13.0)',
  'pycares (>=5.0.0)',
  'yarl (>=1.6.0)',
]

[tool.poetry]
requires-poetry = '>=2.0'

[project.urls]
homepage = "https://github.com/frenck/python-radios"
repository = "https://github.com/frenck/python-radios"
documentation = "https://github.com/frenck/python-radios"
"Bug Tracker" = "https://github.com/frenck/python-radios/issues"
Changelog = "https://github.com/frenck/python-radios/releases"

[tool.poetry.group.dev.dependencies]
aioresponses = "0.7.9"
codespell = "2.4.3"
covdefaults = "2.3.0"
coverage = { version = "7.16.2", extras = ["toml"] }
pre-commit-hooks = "6.0.0"
prek = "0.5.4"
pylint = "4.0.9"
pytest = "9.1.1"
pytest-asyncio = "1.4.0"
pytest-cov = "7.1.0"
ruff = "0.16.9"
syrupy = "6.1.1"
ty = "0.0.84"
yamllint = "1.38.0"
zizmor = "1.30.1"
pycountry = "24.6.1"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["radios"]

[tool.coverage.report]
show_missing = true

[tool.ty.environment]
python-version = "3.12"

[tool.pylint.MASTER]
ignore = ["tests"]

[tool.pylint.BASIC]
good-names = ["_", "ex", "fp", "i", "id", "j", "k", "on", "Run", "T"]

[tool.pylint.DESIGN]
max-attributes = 15

[tool.pylint."MESSAGES CONTROL"]
disable = ["duplicate-code", "format", "unsubscriptable-object"]

[tool.pylint.SIMILARITIES]
ignore-imports = true

[tool.pylint.FORMAT]
max-line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
xfail_strict = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",  # Opinionated warning on disallowing dynamically typed expressions
  "TRY301",  # Abstract raise to inner function, not useful for this codebase
  "D203",    # Conflicts with other rules
  "D213",    # Conflicts with other rules
  "D417",    # False positives in some occasions
  "PLR2004", # Just annoying, not really useful
  "PLR0917", # Existing API signatures and calls intentionally use many args
  "CPY001",  # Project does not enforce file-level copyright headers

  # Conflicts with the Ruff formatter
  "COM812",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "FBT001", # Boolean positional args are idiomatic in parametrized tests
  "FBT002", # Boolean defaults are idiomatic in parametrized tests
]
"scripts/*.py" = [
  "INP001", # Standalone scripts, run by hand, not a package
]

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false
fixture-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["radios"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "mashumaro.mixins.orjson.DataClassORJSONMixin",
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.codespell]
ignore-words-list = "hass"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
